  <text x="580" y="114" fill="#dcdfe8" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">2026年11月14日</text>

  <text x="588" y="156" fill="#c0c3ce" font-family="sans-serif" font-size="13">◀</text>
  <text x="734" y="156" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" text-anchor="middle">十一月</text>
  <text x="880" y="156" fill="#c0c3ce" font-family="sans-serif" font-size="13" text-anchor="end">▶</text>

