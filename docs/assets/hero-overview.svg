  <!-- Assistant Markdown & Code Body -->
  <text x="102" y="354" fill="#f0f2f8" font-family="Noto Sans CJK SC, sans-serif" font-size="13">紫金矿业 (<tspan font-weight="700" fill="#ffffff">601899.SS</tspan>) 最新收盘价为 <tspan font-weight="700" fill="#57e389">26.38 元/股</tspan>（周五收盘）：</text>

  <!-- Code Block Card -->
  <rect x="102" y="366" width="416" height="92" rx="9" fill="#1d1e24" stroke="#363842" stroke-width="1"/>
  <rect x="102" y="366" width="416" height="24" rx="9" fill="#282a32"/>
  <text x="114" y="382" fill="#9aa0ae" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700">bash</text>
  <rect x="456" y="369" width="54" height="18" rx="5" fill="#3a3c46"/>
  <text x="483" y="381" fill="#d8dbe4" font-family="Noto Sans CJK SC, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">复制代码</text>
  <text x="114" y="408" fill="#7dcfff" font-family="JetBrains Mono, monospace" font-size="11.5">Price: 26.38 CNY | EPS (TTM): 1.35 CNY</text>
  <text x="114" y="428" fill="#bb9af7" font-family="JetBrains Mono, monospace" font-size="11.5">PE (TTM) = 26.38 / 1.35 ≈ 19.54x</text>
  <text x="114" y="448" fill="#9ece6a" font-family="JetBrains Mono, monospace" font-size="11.5"># 支持联网抓取、本地文件检索与终端命令交互式审批</text>

