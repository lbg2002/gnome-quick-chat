  <text x="102" y="508" fill="#7c808d" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5">输入问题（Enter 发送，↑↓ 历史，Esc 停止）…</text>
  <rect x="478" y="484" width="62" height="38" rx="11" fill="#3584e4"/>
