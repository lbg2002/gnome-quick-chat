<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161d"/>
      <stop offset="50%" stop-color="#1c202b"/>
      <stop offset="100%" stop-color="#12151e"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#232328"/>
    </linearGradient>
    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#233d63"/>
      <stop offset="100%" stop-color="#1e3454"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="btnShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="980" height="560" rx="18" fill="url(#bgGrad)"/>

  <!-- GNOME Top Bar -->
  <rect x="0" y="0" width="980" height="34" rx="18" fill="#0d0e12"/>
  <rect x="0" y="16" width="980" height="18" fill="#0d0e12"/>
  <circle cx="24" cy="17" r="5" fill="#ffffff" opacity="0.85"/>
  <rect x="36" y="14" width="22" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
  <!-- Top Bar Center Clock Pill -->
  <rect x="415" y="4" width="150" height="26" rx="13" fill="#2f313a"/>
  <text x="490" y="21" fill="#ffffff" font-family="Noto Sans CJK SC, Inter, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">11月14日  11:20</text>
  <!-- Top Bar Right System Indicators -->
  <text x="945" y="21" fill="#d8dee9" font-family="Inter, sans-serif" font-size="12" text-anchor="end">Wi-Fi  🔊  🔋 98%</text>

  <!-- GNOME DateMenu Popover Container -->
  <g filter="url(#shadow)">
    <rect x="70" y="46" width="840" height="492" rx="22" fill="url(#panelBg)" stroke="#3e3f47" stroke-width="1.2"/>
  </g>

  <!-- Vertical Divider between Left Column (Quick Chat) and Right Column (Calendar) -->
  <line x1="558" y1="62" x2="558" y2="522" stroke="#393a42" stroke-width="1"/>

  <!-- ================= LEFT COLUMN: QUICK CHAT ================= -->
  <!-- Segmented Tab Switcher -->
  <rect x="88" y="62" width="166" height="36" rx="12" fill="#34353d" stroke="#454650" stroke-width="1"/>
  <!-- Active Tab: 随问 -->
  <rect x="92" y="65" width="82" height="30" rx="9" fill="#484a54"/>
  <text x="133" y="85" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" text-anchor="middle">✦ 随问</text>
  <!-- Inactive Tab: 通知 8 -->
  <text x="200" y="85" fill="#b0b3be" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" text-anchor="middle">通知</text>
  <rect x="220" y="72" width="22" height="16" rx="8" fill="#3584e4"/>
  <text x="231" y="84" fill="#ffffff" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">8</text>

  <!-- Settings Gear Button -->
  <rect x="506" y="62" width="34" height="34" rx="10" fill="#34353d" stroke="#454650" stroke-width="1"/>
  <text x="523" y="84" fill="#d8dee9" font-family="sans-serif" font-size="15" text-anchor="middle">⚙</text>

  <!-- Status Header Row -->
  <rect x="88" y="108" width="452" height="38" rx="12" fill="#31323a" stroke="#3f404a" stroke-width="1"/>
  <circle cx="106" cy="127" r="4.5" fill="#2ec27e"/>
  <text x="118" y="131" fill="#d5d7df" font-family="Inter, Noto Sans CJK SC, sans-serif" font-size="12.2" font-weight="600">ZCode · gpt-6-luna ▾ · 智能审批</text>
  <rect x="424" y="114" width="32" height="26" rx="8" fill="#383a43"/>
  <text x="440" y="131" fill="#e5e7ef" font-family="Noto Sans CJK SC, sans-serif" font-size="11.5" text-anchor="middle">📋</text>
  <rect x="462" y="114" width="70" height="26" rx="8" fill="#3e4049"/>
  <text x="497" y="131" fill="#e5e7ef" font-family="Noto Sans CJK SC, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">＋ 新对话</text>

  <!-- User Message Bubble -->
  <rect x="112" y="156" width="428" height="58" rx="14" fill="url(#userBubble)" stroke="#3864a0" stroke-width="1"/>
  <text x="126" y="175" fill="#c0d6f5" font-family="Noto Sans CJK SC, sans-serif" font-size="11.5" font-weight="700">我</text>
  <text x="145" y="175" fill="#8aa9d6" font-family="Inter, sans-serif" font-size="11">11:18</text>
  <rect x="494" y="162" width="36" height="18" rx="5" fill="#2e4d7a"/>
  <text x="512" y="174" fill="#d8e6fa" font-family="Noto Sans CJK SC, sans-serif" font-size="10" font-weight="600" text-anchor="middle">复制</text>
  <text x="126" y="200" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="600">上网查一下今天紫金矿业的 A 股股价，并用脚本算一下市盈率</text>

  <!-- Assistant Message Card -->
  <rect x="88" y="224" width="444" height="248" rx="14" fill="#32333b" stroke="#42434e" stroke-width="1"/>
  <text x="102" y="244" fill="#dcdfe8" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">gpt-6-luna</text>
  <text x="172" y="244" fill="#888b96" font-family="Inter, sans-serif" font-size="11">11:18</text>
  <rect x="484" y="230" width="36" height="18" rx="5" fill="#41434d"/>
  <text x="502" y="242" fill="#d8dbe4" font-family="Noto Sans CJK SC, sans-serif" font-size="10" font-weight="600" text-anchor="middle">复制</text>

