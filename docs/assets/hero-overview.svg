  <g filter="url(#btnShadow)">
    <circle cx="496" cy="442" r="14" fill="#2d2e36" stroke="#585b68" stroke-width="1.2"/>
    <path d="M491.5 440.5 L496 445 L500.5 440.5 M496 436 L496 445" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

