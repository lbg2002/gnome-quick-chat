    <text x="592" y="260">02</text><text x="639" y="260">03</text><text x="686" y="260">04</text><text x="733" y="260">05</text><text x="780" y="260">06</text><text x="827" y="260">07</text><text x="874" y="260">08</text>
    <text x="592" y="294">09</text><text x="639" y="294">10</text><text x="686" y="294">11</text><text x="733" y="294">12</text><text x="780" y="294">13</text>
    <circle cx="827" cy="290" r="15" fill="#3584e4"/>
    <text x="827" y="294" fill="#ffffff" font-weight="700">14</text>
    <text x="874" y="294">15</text>
    <text x="592" y="328">16</text><text x="639" y="328">17</text><text x="686" y="328">18</text><text x="733" y="328">19</text><text x="780" y="328">20</text><text x="827" y="328">21</text><text x="874" y="328">22</text>
    <text x="592" y="362">23</text><text x="639" y="362">24</text><text x="686" y="362">25</text><text x="733" y="362">26</text><text x="780" y="362">27</text><text x="827" y="362">28</text><text x="874" y="362">29</text>
  </g>

  <!-- Today Events Card -->
  <rect x="578" y="396" width="312" height="72" rx="14" fill="#32333b"/>
  <text x="594" y="422" fill="#a8acb8" font-family="Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="700">今天</text>
  <text x="594" y="448" fill="#858996" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-style="italic">无事件</text>

  <!-- World Clocks Button -->
