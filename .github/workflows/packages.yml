name: Build install packages and GitHub Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build GNOME ZIP + Ubuntu DEB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaging and GJS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell gjs gir1.2-soup-3.0 libglib2.0-bin unzip dpkg-dev
      - name: Validate release version and tag
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          v=json.load(open('package.json'))['version']
          meta=json.load(open('metadata.json'))
          assert meta['version-name']==v
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',v)
          ref=os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              assert ref=='refs/tags/v'+v, f'Git tag {ref} must match version {v}'
          PY
      - name: Syntax, schema and behavior checks
        run: |
          for f in extension.js prefs.js backendClient.js protocol.js zcodeBridge.cjs \
                   backends/*.js core/*.js runtime/*.js ui/*.js tests/*.js tests/fixtures/*.js; do
            node --check "$f"
          done
          bash -n install.sh uninstall.sh pack.sh scripts/*.sh
          glib-compile-schemas --strict --dry-run schemas
          npm test
          gjs -m tests/gjs_smoke.js
      - name: Build and verify packages
        run: |
          bash scripts/build-packages.sh dist
          ls -lh dist/
          (cd dist && sha256sum -c SHA256SUMS)
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -F 'quick-chat@lbg2002.github.io/extension.js'
          unzip -Z1 dist/*.zip | grep -Fx metadata.json
          unzip -Z1 dist/*.zip | grep -Fx extension.js
      - name: Upload install packages for every push
        uses: actions/upload-artifact@v4
        with:
          name: quick-chat-install-packages
          path: |
            dist/*.deb
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish signed-by-hash release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quick-chat-install-packages
          path: release
      - name: Reverify artifacts and publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "$TAG" release/*.zip release/*.deb release/SHA256SUMS \
            --verify-tag --generate-notes --title "Quick Chat $TAG"
