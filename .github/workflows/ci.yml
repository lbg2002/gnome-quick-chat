name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Syntax, Schema, Manifest & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GLib schema compiler & GJS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gjs gir1.2-soup-3.0

      - name: Check JS / CJS syntax
        run: |
          for f in extension.js prefs.js backendClient.js protocol.js zcodeBridge.cjs backends/*.js core/*.js runtime/*.js ui/*.js tests/*.js tests/fixtures/*.js; do
            node --check "$f"
          done

      - name: Check shell script syntax
        run: bash -n install.sh uninstall.sh pack.sh scripts/diagnose-local.sh scripts/measure-shell.sh

      - name: Validate GSettings XML schema strictly
        run: glib-compile-schemas --strict --dry-run schemas

      - name: Verify package manifest & forbidden legacy artifacts
        run: |
          test ! -e piClient.js
          grep -Fq -- '--extra-source=backends' pack.sh
          grep -Fq -- '--extra-source=core' pack.sh
          grep -Fq -- '--extra-source=runtime' pack.sh
          grep -Fq -- '--extra-source=ui' pack.sh
          python3 - << 'PY'
          import json
          meta = json.load(open('metadata.json', encoding='utf-8'))
          assert meta['uuid'] == 'quick-chat@lbg2002.github.io'
          assert meta['settings-schema'] == 'org.gnome.shell.extensions.quick-chat'
          assert meta['shell-version'] == ['50'], f"Expected GNOME 50 only, got {meta['shell-version']}"
          PY

      - name: Run headless GJS pure-module & Gio integration smoke check
        run: gjs -m tests/gjs_smoke.js

      - name: Test installed extension bundle in real headless GJS
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          mkdir -p "$tmp/home"
          XDG_DATA_HOME="$tmp/data" HOME="$tmp/home" bash install.sh
          bundle="$tmp/data/gnome-shell/extensions/quick-chat@lbg2002.github.io"
          test -f "$bundle/schemas/gschemas.compiled"
          mkdir -p "$bundle/tests/fixtures"
          cp tests/gjs_smoke.js "$bundle/tests/"
          cp tests/fixtures/productionAdapterFixtures.js "$bundle/tests/fixtures/"
          (cd "$bundle" && gjs -m tests/gjs_smoke.js)

      - name: Run automated unit, security, streaming & lifecycle tests
        run: npm test
