name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Syntax, Schema, Manifest & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GLib schema compiler & GJS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gjs

      - name: Check JS / CJS syntax
        run: |
          for f in extension.js prefs.js backendClient.js protocol.js zcodeBridge.cjs backends/*.js core/*.js runtime/*.js ui/*.js tests/*.js; do
            node --check "$f"
          done

      - name: Check shell script syntax
        run: bash -n install.sh uninstall.sh pack.sh

      - name: Validate GSettings XML schema strictly
        run: glib-compile-schemas --strict --dry-run schemas

      - name: Verify package manifest & forbidden legacy artifacts
        run: |
          test ! -e piClient.js
          grep -Fq -- '--extra-source=backends' pack.sh
          grep -Fq -- '--extra-source=core' pack.sh
          grep -Fq -- '--extra-source=runtime' pack.sh
          grep -Fq -- '--extra-source=ui' pack.sh
          python3 - << 'PY'
          import json
          meta = json.load(open('metadata.json', encoding='utf-8'))
          assert meta['uuid'] == 'quick-chat@lbg2002.github.io'
          assert meta['settings-schema'] == 'org.gnome.shell.extensions.quick-chat'
          assert meta['shell-version'] == ['50'], f"Expected GNOME 50 only, got {meta['shell-version']}"
          PY

      - name: Run headless GJS pure-module smoke check
        run: |
          gjs -m -c "
            import {BackendRegistry, MemorySettingsStore} from './core/backendRegistry.js';
            import {detectBackendSelection} from './core/backendDetect.js';
            import {matchSlashCommands} from './core/quickActions.js';
            import {AttachmentManager} from './core/attachmentManager.js';
            import {BackgroundNotificationGate} from './core/notificationPolicy.js';
            import {recommendRouteLocally} from './core/modelRouter.js';
            import {formatRedactedDiagnosticsText} from './core/diagnosticsReport.js';
            const s = new MemorySettingsStore({backend: 'openai', 'openai-base-url': 'https://api.example.com/v1'});
            const reg = new BackendRegistry(s);
            const sel = detectBackendSelection({configuredBackend: reg.getConfiguredBackend(), openaiBaseUrl: 'https://api.example.com/v1'});
            if (sel.effectiveBackend !== 'openai') throw new Error('Unexpected backend in GJS smoke check');
            if (!matchSlashCommands('/explain').active) throw new Error('Slash command smoke check failed');
            const att = new AttachmentManager();
            if (!att.addTextSnippet('hello').ok) throw new Error('Attachment smoke check failed');
            const gate = new BackgroundNotificationGate();
            if (gate.evaluate({kind: 'turn_completed', isLocked: true}).shouldNotify) throw new Error('Lock gate failed');
            if (!formatRedactedDiagnosticsText({effectiveBackend: 'openai'}).includes('openai')) throw new Error('Diagnostics failed');
            void recommendRouteLocally;
          "

      - name: Run automated unit, security, streaming & lifecycle tests
        run: npm test
